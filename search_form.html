<!DOCTYPE html>
<html lang="en">
<head>
  <title>MGH App Search</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <style>
    body { padding-top: 10px; }
    .container { max-width: 640px; }
    #status { margin-top: 20px; }
    .spinner {
      display: inline-block; width: 16px; height: 16px; margin-right: 8px;
      vertical-align: -3px; border: 3px solid #bce8f1; border-top-color: #31708f;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <h1>App Search</h1>
  <p>Search Google Play or the Apple App Store and download the results as a CSV file.</p>

  <form id="search_form" action="/search_results" method="get">
    <fieldset id="fields">
      <div class="form-group">
        <label for="search_query">Search query</label>
        <input class="form-control" type="search" id="search_query" name="search_query"
               placeholder="e.g. opioid addiction recovery" autofocus required>
      </div>

      <div class="form-group">
        <label for="n_results">Number of results (1&ndash;200)</label>
        <input class="form-control" type="number" id="n_results" name="n_results"
               min="1" max="200" value="200" required>
      </div>

      <div class="form-group">
        <label>Store</label>
        <div class="radio"><label><input type="radio" name="os" value="android" checked> Google Play</label></div>
        <div class="radio"><label><input type="radio" name="os" value="ios"> Apple App Store</label></div>
      </div>

      <button id="submit1" type="submit" class="btn btn-primary">Search and download CSV</button>
    </fieldset>
  </form>

  <div id="status" class="alert" style="display:none" role="status" aria-live="polite"></div>

  <p class="text-muted small">
    Large searches can take a minute or more. If the site has been idle, the first visit may also take
    up to a minute to wake up.
  </p>
</div>

<script>
(function () {
  var form = document.getElementById('search_form');
  var fields = document.getElementById('fields');
  var button = document.getElementById('submit1');
  var statusBox = document.getElementById('status');
  var timer = null;

  function showStatus(kind, html) {
    statusBox.className = 'alert alert-' + kind;
    statusBox.innerHTML = html;
    statusBox.style.display = 'block';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setBusy(busy) {
    fields.disabled = busy;
    button.textContent = busy ? 'Searching\u2026' : 'Search and download CSV';
    if (!busy && timer) { clearInterval(timer); timer = null; }
  }

  function filenameFrom(response, fallback) {
    var cd = response.headers.get('Content-Disposition') || '';
    var m = /filename\*=UTF-8''([^;]+)/i.exec(cd) || /filename="?([^";]+)"?/i.exec(cd);
    return m ? decodeURIComponent(m[1]) : fallback;
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (fields.disabled) { return; }

    var data = new FormData(form);
    var params = new URLSearchParams(data);
    var storeName = data.get('os') === 'ios' ? 'the Apple App Store' : 'Google Play';
    var label = 'Searching ' + storeName + ' for \u201c' + escapeHtml(data.get('search_query')) +
                '\u201d (' + escapeHtml(data.get('n_results')) + ' results)\u2026 ';
    var started = Date.now();

    setBusy(true);
    var tick = function () {
      var secs = Math.round((Date.now() - started) / 1000);
      showStatus('info', '<span class="spinner"></span>' + label + secs + 's');
    };
    tick();
    timer = setInterval(tick, 1000);

    fetch('/search_results?' + params.toString())
      .then(function (response) {
        if (!response.ok) {
          return response.text().then(function (text) {
            throw new Error(text || ('Server error ' + response.status));
          });
        }
        var name = filenameFrom(response, 'results.csv');
        return response.blob().then(function (blob) { return { blob: blob, name: name }; });
      })
      .then(function (result) {
        var url = URL.createObjectURL(result.blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = result.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        var secs = Math.round((Date.now() - started) / 1000);
        setBusy(false);
        showStatus('success', '<strong>Done</strong> in ' + secs + 's: <code>' +
                   escapeHtml(result.name) + '</code> downloaded.');
      })
      .catch(function (err) {
        setBusy(false);
        showStatus('danger', '<strong>Search failed.</strong> ' + escapeHtml(err.message) +
                   '<br>Please try again in a minute.');
      });
  });
})();
</script>
</body>
</html>
